<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cast Screws — Satisfactory visualizer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="viewport"></div>
    <aside id="panel">
      <p class="eyebrow">Satisfactory visualizer</p>
      <h1 id="title">Screws</h1>
      <p class="lede" id="lede">Cast Screws. Iron ingots in. The belt sets the rate.</p>
      <div class="item-picker">
        <label for="item-search">Item</label>
        <input
          id="item-search"
          type="search"
          role="combobox"
          aria-autocomplete="list"
          aria-controls="item-list"
          aria-expanded="false"
          autocomplete="off"
          placeholder="Search parts"
        />
        <ul id="item-list" role="listbox" hidden></ul>
      </div>
      <fieldset id="alt-field">
        <legend>Alt recipes</legend>
        <label class="save-row">
          Save
          <input id="save-file" type="file" accept=".sav,application/octet-stream" />
        </label>
        <p id="save-note" class="hint"></p>
        <div class="marks" id="alt-mode">
          <label><input type="radio" name="alt-mode" value="all" checked /> All alts</label>
          <label><input type="radio" name="alt-mode" value="save" /> Unlocked in save</label>
        </div>
        <input id="alt-search" type="search" placeholder="Search alts" autocomplete="off" />
        <div id="alts"></div>
      </fieldset>
      <fieldset>
        <legend>Belt</legend>
        <div class="marks">
          <label><input type="radio" name="mk" value="1" /> Mk1 · 60</label>
          <label><input type="radio" name="mk" value="2" /> Mk2 · 120</label>
          <label><input type="radio" name="mk" value="3" checked /> Mk3 · 270</label>
          <label><input type="radio" name="mk" value="4" /> Mk4 · 480</label>
        </div>
      </fieldset>
      <button id="generate" type="button">Generate</button>
      <div id="summary" aria-live="polite"></div>
      <p class="hint">Drag to orbit. Scroll to zoom. No walking camera yet.</p>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
